services:
  db:
    container_name: workout-db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"

  db-test:
    container_name: workout-db-test
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: workout_test
      POSTGRES_PASSWORD: workout_test
      POSTGRES_DB: workout_test_db
    volumes:
      - db_test_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis-test:
    container_name: workout-redis-test
    image: redis:7-alpine
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data

  redis:
    container_name: workout-redis
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailhog:
    container_name: workout-mailhog
    image: mailhog/mailhog:latest
    restart: always
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI

  backend:
    container_name: workout-backend
    build: ./backend
    command: npm run start:dev
    volumes:
      - ./backend:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAILHOG_HOST: mailhog
      MAILHOG_PORT: 1025
    ports:
      - "3001:3001"
    depends_on:
      - db
      - redis
      - mailhog

  frontend:
    container_name: workout-frontend
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
  db_test_data:
  redis_data:
  redis_test_data:
  backend_node_modules:
  frontend_node_modules:
